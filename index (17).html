/* plátno: k najbližších susedov – skutočné strojové učenie */
function knnTask(lv) {
  return {
    n: lv === 'o' ? 'Mačka alebo zajac?' : lv === 'v' ? 'Natrénuj model' : 'Preučenie',
    run(box, ctx) {
      const A = { k: 'c', e: '🐱', name: 'mačka', col: '#ef8a4a' }, B = { k: 'r', e: '🐰', name: 'zajac', col: '#4a8fd9' };
      // skutočné pravidlo: zajac = dlhé uši, krátky chvost
      const truth = (x, y) => (x - y + (Math.random() - .5) * .15) > 0 ? 'r' : 'c';
      const gen = (n, noise = 0) => Array.from({ length: n }, () => { const x = Math.random() * .9 + .05, y = Math.random() * .9 + .05; let c = (x - y) > 0 ? 'r' : 'c'; if (Math.abs(x - y) < .08) c = truth(x, y); if (Math.random() < noise) c = c === 'r' ? 'c' : 'r'; return { x, y, c }; });
      let train = lv === 'v' ? [{ x: .2, y: .75, c: 'c' }, { x: .3, y: .6, c: 'c' }, { x: .75, y: .2, c: 'r' }, { x: .6, y: .3, c: 'r' }] : gen(lv === 'o' ? 14 : 40, lv === 'a' ? .14 : 0);
      if (lv === 'o') train = train.filter(p => Math.abs(p.x - p.y) > .12);
      const test = gen(lv === 'a' ? 40 : 4).filter(p => Math.abs(p.x - p.y) > (lv === 'a' ? 0 : .1));
      // Architekti: samostatná validačná množina na výber k; test sa použije až na konci
      const val = lv === 'a' ? gen(40) : [];
      let chosenK = null;
      let K = lv === 'a' ? 1 : lv === 'o' ? 3 : 1;
      const knn = (x, y, k = K, data = train, skip = null) => { const d = data.filter(p => p !== skip).map(p => [Math.hypot(p.x - x, p.y - y), p]).sort((a, b) => a[0] - b[0]).slice(0, k); const r = d.filter(q => q[1].c === 'r').length; return { c: r * 2 > d.length ? 'r' : r * 2 < d.length ? 'c' : d[0][1].c, nb: d.map(q => q[1]) }; };
      const title = lv === 'o' ? 'Mačka alebo zajac?' : lv === 'v' ? 'Natrénuj vlastný model' : 'Nájdi najlepšie k';
      const lead = lv === 'o' ? 'Bit pozná zvieratá podľa **dĺžky uší** (doprava sú dlhšie) a **dĺžky chvosta** (hore je dlhší). Objaví sa neznáme zviera „?“. Tipni si, čo to je. Potom uvidíš, čo povie Bit.'
        : lv === 'v' ? 'Toto je skutočné strojové učenie. Vyber zviera a ťukaním do plochy pridávaj príklady: **mačky majú krátke uši a dlhý chvost, zajace dlhé uši a krátky chvost**. Farba plochy ukazuje, čo by model tipol. Potom ho otestuj na zvieratách, ktoré ešte nevidel.'
          : 'Model **k najbližších susedov** zaradí nové zviera podľa *k* najpodobnejších príkladov. V **trénovacích** dátach je zámerne 14 % zle označených príkladov (šum). Validačné a testovacie príklady sú označené správne, aby si videl(a), ako chybné označenia pri učení ovplyvnia výsledok. Postupuj ako vývojári: **trénovacie** dáta (zvieratká) slúžia na učenie, **validačné** (krúžky) na výber *k* a **testovacie** dáta sú odložené bokom. Ukážu sa až po výbere *k* ako nezávislé záverečné overenie.';
      const F = TF(box, ctx, { title, lead, fresh: true, help: lv === 'a' ? 'Pri k = 1 si model „zapamätá“ každý príklad aj s chybami. Vysoké k zas všetko príliš vyhladí. Porovnávaj riadky „tréning bez seba“ a „test“.' : lv === 'v' ? 'Pridaj aspoň 4 mačky a 4 zajace rozložené po celej ploche. Mačky naľavo hore, zajace napravo dole.' : 'Pozri, ktoré zvieratá sú najbližšie k otázniku.' });
      const cv = el('canvas', { class: 'cv', width: 600, height: 480, 'aria-label': 'Plocha: vodorovne dĺžka uší, zvisle dĺžka chvosta' });
      const ctx2 = cv.getContext('2d');
      const W = 600, H = 480, PAD = 34;
      const X = x => PAD + x * (W - PAD * 1.5), Y = y => H - PAD - y * (H - PAD * 1.6);
      const ux = px => (px - PAD) / (W - PAD * 1.5), uy = py => (H - PAD - py) / (H - PAD * 1.6);
      let mystery = null, showNb = false, cls = 'c';
      const draw = () => {
        const dark = document.body.classList.contains('lv-a');
        ctx2.clearRect(0, 0, W, H);
        ctx2.fillStyle = dark ? '#0c1d28' : '#f6f9f8'; ctx2.fillRect(0, 0, W, H);
        // rozhodovacia mapa
        if (train.length >= 2 && lv !== 'o') {
          const st = 12;
          for (let px = PAD; px < W - PAD / 2; px += st) for (let py = PAD * .6; py < H - PAD; py += st) {
            const r = knn(ux(px + st / 2), uy(py + st / 2));
            ctx2.fillStyle = r.c === 'r' ? 'rgba(74,143,217,.16)' : 'rgba(239,138,74,.16)'; ctx2.fillRect(px, py, st, st);
          }
        }
        // osi
        ctx2.strokeStyle = dark ? '#3c5560' : '#b9c9cc'; ctx2.lineWidth = 2; ctx2.beginPath(); ctx2.moveTo(PAD, PAD * .6); ctx2.lineTo(PAD, H - PAD); ctx2.lineTo(W - PAD / 2, H - PAD); ctx2.stroke();
        ctx2.fillStyle = dark ? '#b9ccd2' : '#36505e'; ctx2.font = '700 15px Manrope,sans-serif';
        ctx2.fillText('dĺžka uší →', W - 140, H - 10); ctx2.save(); ctx2.translate(18, 150); ctx2.rotate(-Math.PI / 2); ctx2.fillText('dĺžka chvosta →', 0, 0); ctx2.restore();
        ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
        if (mystery && showNb) { const r = knn(mystery.x, mystery.y); ctx2.strokeStyle = '#ffc24b'; ctx2.lineWidth = 3; r.nb.forEach(p => { ctx2.beginPath(); ctx2.moveTo(X(mystery.x), Y(mystery.y)); ctx2.lineTo(X(p.x), Y(p.y)); ctx2.stroke(); }); }
        train.forEach(p => { ctx2.font = (lv === 'o' ? 30 : 22) + 'px serif'; ctx2.fillText(p.c === 'r' ? B.e : A.e, X(p.x), Y(p.y)); });
        if (lv === 'a') val.forEach(p => { ctx2.strokeStyle = p.c === 'r' ? B.col : A.col; ctx2.lineWidth = 2.5; ctx2.beginPath(); ctx2.arc(X(p.x), Y(p.y), 5, 0, 7); ctx2.stroke(); });
        if (lv === 'a' && chosenK) test.forEach(p => { ctx2.fillStyle = p.c === 'r' ? B.col : A.col; ctx2.fillRect(X(p.x) - 4, Y(p.y) - 4, 8, 8); });
        if (mystery) { ctx2.fillStyle = '#0e2a3b'; ctx2.beginPath(); ctx2.arc(X(mystery.x), Y(mystery.y), 19, 0, 7); ctx2.fill(); ctx2.fillStyle = '#ffc24b'; ctx2.font = '800 22px Unbounded,sans-serif'; ctx2.fillText('?', X(mystery.x), Y(mystery.y) + 1); }
        ctx2.textAlign = 'start'; ctx2.textBaseline = 'alphabetic';
      };
      F.body.append(cv, el('div', { class: 'legend' }, el('span', {}, el('i', { style: `background:${A.col}` }), '🐱 mačka'), el('span', {}, el('i', { style: `background:${B.col}` }), '🐰 zajac'), lv === 'a' ? el('span', {}, '○ krúžok = validačné zviera (výber k)') : null, lv === 'a' ? el('span', {}, '■ štvorček = testovacie zviera (ukáže sa až po výbere)') : null));
      const panel = el('div', { style: 'margin-top:12px' }); F.body.append(panel);

      if (lv === 'o') {
        let round = 0, good = 0;
        const next = () => {
          round++; showNb = false;
          do { mystery = { x: Math.random() * .8 + .1, y: Math.random() * .8 + .1 }; } while (Math.abs(mystery.x - mystery.y) < .2);
          draw(); panel.innerHTML = '';
          panel.append(el('div', { class: 'q' }, `Zviera ${round} z 3: Čo je to podľa teba?`), el('div', { class: 'row' }, [A, B].map(z => el('button', { class: 'btn ghost', style: 'font-size:18px', onclick: () => guess(z.k) }, z.e + ' ' + z.name))));
        };
        const guess = g => {
          showNb = true; draw(); const r = knn(mystery.x, mystery.y); const ok = r.c === g; if (ok) good++; beep(ok ? 1 : 0);
          panel.innerHTML = '';
          panel.append(el('div', { class: 'why', html: `Bit našiel <b>3 najpodobnejšie</b> zvieratá (žlté čiary). Väčšina z nich je ${r.c === 'r' ? '🐰 zajac' : '🐱 mačka'}, preto tipuje: <b>${r.c === 'r' ? 'zajac' : 'mačka'}</b>. ${ok ? 'Tipli ste si rovnako!' : 'Ty si tipol(-la) inak. Pozri, kde zviera leží.'}` }));
          if (round < 3) panel.append(el('div', { class: 'acts' }, el('span', { class: 'sp' }), el('button', { class: 'btn', onclick: next }, 'Ďalšie zviera')));
          else F.ok(`S Bitom ste sa zhodli ${good}-krát z 3.`, 'Bit nevie, čo je mačka. Len porovná **čísla** (dĺžku uší a chvosta) s príkladmi, ktoré už pozná, a vyberie najpodobnejšie. Tomu sa hovorí **[[strojové učenie]]**. Čím viac dobrých príkladov, tým lepšie tipuje.');
        };
        next();
      }
      if (lv === 'v') {
        const cnt = el('span', { style: 'font-weight:700;font-size:14px;color:var(--mute)' });
        const bA = el('button', { class: 'btn small', onclick: () => setC('c') }, '🐱 pridávam mačky'), bB = el('button', { class: 'btn small ghost', onclick: () => setC('r') }, '🐰 pridávam zajace');
        const setC = c => { cls = c; bA.className = 'btn small' + (c === 'c' ? '' : ' ghost'); bB.className = 'btn small' + (c === 'r' ? '' : ' ghost'); };
        const res = el('div', {});
        panel.append(el('div', { class: 'row' }, bA, bB, el('button', { class: 'btn small ghost', onclick: () => { train.pop(); upd(); } }, el('span', { html: ic('undo') }), 'Späť'), cnt), res);
        const upd = () => { cnt.textContent = `🐱 ${train.filter(p => p.c === 'c').length} · 🐰 ${train.filter(p => p.c === 'r').length}`; draw(); };
        const add = e => { const r = cv.getBoundingClientRect(); const x = ux((e.clientX - r.left) * W / r.width), y = uy((e.clientY - r.top) * H / r.height); if (x < 0 || x > 1 || y < 0 || y > 1) return; train.push({ x, y, c: cls }); upd(); F.clear(); };
        cv.addEventListener('click', add);
        // pridanie príkladu bez myši (klávesnica, čítačka obrazovky)
        const kx = el('input', { type: 'number', min: 0, max: 10, value: 5, 'aria-label': 'Dĺžka uší 0 až 10', style: 'width:74px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper2);padding:0 8px;font:700 16px var(--fm)' });
        const ky = el('input', { type: 'number', min: 0, max: 10, value: 5, 'aria-label': 'Dĺžka chvosta 0 až 10', style: 'width:74px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper2);padding:0 8px;font:700 16px var(--fm)' });
        panel.append(el('details', { class: 'help', style: 'margin-top:10px' }, el('summary', {}, 'Pridať príklad bez myši (čísla)'),
          el('div', { class: 'row', style: 'padding:6px 0 12px' }, el('label', { style: 'font-weight:700;font-size:14px' }, 'uši (0 – 10)'), kx, el('label', { style: 'font-weight:700;font-size:14px' }, 'chvost (0 – 10)'), ky,
            el('button', { class: 'btn small', onclick: () => { const x = Math.min(10, Math.max(0, +kx.value || 0)) / 10, y = Math.min(10, Math.max(0, +ky.value || 0)) / 10; train.push({ x: .03 + x * .94, y: .03 + y * .94, c: cls }); upd(); F.info(`Pridané: ${cls === 'c' ? 'mačka' : 'zajac'} (uši ${kx.value}, chvost ${ky.value}). Typ zvieraťa meníš tlačidlami vyššie.`); } }, 'Pridať'))));
        upd();
        F.btn('Otestovať model', () => {
          const nc = train.filter(p => p.c === 'c').length, nr = train.filter(p => p.c === 'r').length;
          if (train.length < 8) return F.bad('Pridaj aspoň 4 vlastné príklady. Model sa zatiaľ nemá z čoho učiť.');
          if (nc < 3 || nr < 3) return F.bad('Model potrebuje aspoň 3 mačky a 3 zajace, inak sa nemá z čoho učiť.');
          const t2 = gen(8).filter(p => Math.abs(p.x - p.y) > .1).slice(0, 6);
          const r = t2.map(p => knn(p.x, p.y).c === p.c);
          const ok = r.filter(Boolean).length;
          res.innerHTML = ''; res.append(el('div', { class: 'scen', style: 'margin-top:10px' }, el('span', { class: 'tag' }, 'Test na nových zvieratách'), t2.map((p, i) => el('span', { style: 'font-size:22px;margin-right:6px' }, (p.c === 'r' ? '🐰' : '🐱') + (r[i] ? '✅' : '❌'))), el('div', { style: 'font-weight:700;margin-top:6px' }, `Presnosť: ${ok} z ${t2.length}`)));
          if (ok >= t2.length - 1) F.ok(`Tvoj model určil správne ${ok} z ${t2.length} nových zvierat.`, 'Nenapísal(-a) si žiadne pravidlo „ak má dlhé uši, je to zajac“. Model si ho **odvodil z tvojich príkladov**. Toto je [[učenie s učiteľom]]: príklady majú správnu odpoveď (označenie). Testovacie zvieratá model pri učení nevidel. Iba tak zistíš, či sa naozaj niečo naučil.');
          else F.bad(`Presnosť ${ok} z ${t2.length} je málo. Pozri farbu plochy: Kde model tipuje zle? Pridaj tam správne príklady.`);
        }, '', 'check');
      }
      if (lv === 'a') {
        // loo = leave-one-out: pri hodnotení trénovacieho bodu ho vylúčime zo susedov
        const acc = (data, k, loo = false) => data.filter(p => knn(p.x, p.y, k, train, loo ? p : null).c === p.c).length / data.length;
        const out = el('div', { class: 'bars' });
        const lab = el('label', {}, 'k (počet susedov)', el('span', {}, '1'));
        const sl = el('input', { type: 'range', min: 1, max: 15, step: 2, value: 1, 'aria-label': 'k', oninput: () => upd() });
        const tried = new Set();
        const upd = () => { K = +sl.value; lab.lastChild.textContent = K; tried.add(K); draw(); const a0 = acc(train, K), a1 = acc(train, K, true), a2 = acc(val, K); out.innerHTML = ''; [['tréning (vidí aj seba)', a0], ['tréning bez seba', a1], ['validácia (výber k)', a2]].forEach(([n, a]) => out.append(el('div', { class: 'bar' }, el('span', {}, n), el('span', { class: 't' }, el('i', { style: `width:${a * 100}%` })), el('span', { class: 'v' }, Math.round(a * 100) + ' %'))));
          out.append(chosenK ? el('div', { class: 'bar pick' }, el('span', {}, `test (k = ${chosenK})`), el('span', { class: 't' }, el('i', { style: `width:${acc(test, chosenK) * 100}%` })), el('span', { class: 'v' }, Math.round(acc(test, chosenK) * 100) + ' %')) : el('div', { class: 'bar' }, el('span', {}, 'test'), el('span', { style: 'grid-column:2/4;font-size:13px;color:var(--mute);font-weight:600' }, 'odložený, ukáže sa až po výbere k'))); F.clear(); };
        panel.append(el('div', { class: 'slider' }, lab, sl), out);
        upd();
        F.btn('Potvrdiť výber k', () => {
          // výber parametra len podľa validačnej množiny; testovacia sa pri výbere nepoužíva
          const scores = []; for (let k = 1; k <= 15; k += 2) scores.push([k, acc(val, k)]);
          const best = Math.max(...scores.map(s => s[1])), mine = acc(val, K);
          if (tried.size < 3) return F.bad('Vyskúšaj najprv aspoň tri rôzne hodnoty k.');
          if (mine >= best - .051) { chosenK = K; sl.disabled = true; upd(); const t = acc(test, K); F.ok(`Vybral(a) si k = ${K}. Validácia: ${Math.round(mine * 100)} %. Záverečný test na odložených dátach: ${Math.round(t * 100)} %.`, 'Takto sa postupuje aj v praxi: **trénovacie dáta** slúžia na učenie, **validačné** na výber nastavení (tu *k*) a **testovacie** sa otvoria až na konci ako nezávislé overenie. Keby sme *k* vyberali podľa testu, test by sa stal súčasťou ladenia a jeho výsledok by bol prikrášlený. Prvý riadok („vidí aj seba“) pri k = 1 vždy ukáže 100 %. Každý bod sa totiž porovná sám so sebou, takže to nie je skutočné meranie. Poctivejšie je vylúčiť bod z jeho vlastných susedov (**leave-one-out**, riadok „tréning bez seba“). Model, ktorý si zapamätá každý príklad aj s chybami, je na nových dátach horší. Tomu sa hovorí **[[preučenie]]** (overfitting). Preto sa dáta delia na [[trénovacia množina|trénovaciu]], [[validačná množina|validačnú]] a [[testovacia množina|testovaciu množinu]]. O kvalite modelu rozhoduje výsledok na dátach, ktoré pri učení ani pri ladení nevidel.'); }
          else F.bad(`Pri k = ${K} je validácia ${Math.round(mine * 100)} %. Existuje k, pri ktorom je validácia citeľne lepšia (až ${Math.round(best * 100)} %). Prijmem k, ktoré je od najlepšieho najviac o 5 percentuálnych bodov horšie, lebo pri 40 validačných príkladoch je taký rozdiel už len náhoda.`);
        }, '', 'check');
      }
      draw();
    }
  };
}
T.knn_o = knnTask('o'); T.knn_v = knnTask('v'); T.knn_a = knnTask('a');

/* pravidlá vs. učenie – spam */
T.spam_v = {
  n: 'Pravidlo, či učenie?', run(box, ctx) {
    const MSG = [
      { t: 'VÝHRA! Klikni a získaj iPhone ZADARMO', s: 1 }, { t: 'Zajtra je písomka z matiky, nezabudni kalkulačku', s: 0 }, { t: 'Gratulujeme, vyhrali ste 1000 €, pošlite číslo karty', s: 1 },
      { t: 'Mami, prídem o 5, som u Tomáša', s: 0 }, { t: 'Akcia: lieky na chudnutie zadarmo, klikni sem', s: 1 }, { t: 'Úloha na zajtra: strana 42, cvičenie 3', s: 0 },
      { t: 'Váš balík čaká, zaplaťte clo 1,99 € tu', s: 1 }, { t: 'Ahoj, ideš poobede na futbal?', s: 0 }
    ];
    const WORDS = ['výhra', 'zadarmo', 'klikni', 'zajtra', 'ahoj', 'zaplaťte', 'úloha', 'vyhrali', 'akcia', 'mami'];
    const F = TF(box, ctx, { title: 'Pravidlo, či učenie?', lead: 'Si programátor(ka) spamového filtra z roku 2000. Vyber slová, podľa ktorých filter označí správu ako **spam**. Cieľ: aspoň 7 správ z 8 roztriedených správne.', help: 'Spam láka na výhry, akcie a platby. Slová ako „zajtra“ či „úloha“ sú v bežných správach.' });
    const chosen = new Set();
    const wbox = el('div', { class: 'tiles' }, WORDS.map(w => el('button', { class: 'tile', onclick: e => { chosen.has(w) ? chosen.delete(w) : chosen.add(w); e.currentTarget.classList.toggle('sel'); run(); } }, w)));
    const list = el('div', { class: 'stack', style: 'margin-top:12px' });
    let phase = 1, okc = 0;
    const isSpam = t => [...chosen].some(w => norm(t).includes(norm(w)));
    const run = (msgs = MSG) => { list.innerHTML = ''; okc = 0; msgs.forEach(m => { const p = isSpam(m.t), ok = p === !!m.s; if (ok) okc++; list.append(el('div', { class: 'scen', style: `margin:0;display:flex;gap:10px;align-items:center;border-left:4px solid ${ok ? 'var(--ok)' : 'var(--bad)'}` }, el('span', { style: 'font-size:20px' }, p ? '🗑️' : '📥'), el('span', { style: 'flex:1' }, m.t), el('b', { style: `color:${ok ? 'var(--ok)' : 'var(--bad)'};font-size:13px` }, ok ? 'správne' : 'zle'))); }); F.clear(); };
    F.body.append(wbox, list); run();
    F.btn('Hotovo', () => {
      if (phase === 1) {

/* informačná bublina – simulácia odporúčacieho algoritmu */
function bubbleTask(lv) {
  return {
    n: 'Informačná bublina', run(box, ctx) {
      const TOP = [['⚽', 'šport'], ['🐾', 'zvieratá'], ['🎮', 'hry'], ['🔬', 'veda'], ['🎵', 'hudba'], ['🍳', 'varenie'], ['🌲', 'príroda'], ['😂', 'vtipy'], ['🎨', 'umenie']];
      const w = Object.fromEntries(TOP.map(t => [t[1], 1]));
      const F = TF(box, ctx, { title: 'Ako vzniká informačná bublina', lead: lv === 'a' ? 'Toto je zjednodušený odporúčací algoritmus. **Fáza 1:** Daj „páči sa“ len jednej téme a sleduj, ako sa feed zužuje, kým rozmanitosť neklesne pod 40 %. **Fáza 2:** Vráť rozmanitosť nad 70 %.' : 'Si v aplikácii s videami. **Najprv:** ťukaj „páči sa“ len na jednu tému, kým rozmanitosť neklesne pod 40 %. **Potom:** skús feed vrátiť späť nad 70 %.', help: 'Na zníženie: dávaj páči sa stále tej istej téme. Na zvýšenie: použi „Nezaujíma ma“ pri dominantnej téme a ťukaj na iné témy.' });
      const feed = el('div', { class: 'feed' });
      const mt = el('div', { class: 'meter' }, el('i', {})), ml = el('div', { style: 'font-weight:700;font-size:14px' });
      const phase = el('div', { class: 'scen', style: 'margin-bottom:10px' });
      let ph = 1, mins = 0;
      const div = () => { const s = Object.values(w).reduce((a, b) => a + b, 0); const p = Object.values(w).map(v => (v * v)).map((v, i, a) => v / a.reduce((x, y) => x + y, 0)); const H = -p.reduce((a, v) => a + (v > 0 ? v * Math.log(v) : 0), 0); return H / Math.log(TOP.length); };
      const draw = () => {
        feed.innerHTML = '';
        const tot = Object.values(w).reduce((a, b) => a + b * b, 0);
        for (let i = 0; i < 9; i++) {
          let r = Math.random() * tot, tp = TOP[0];
          for (const t of TOP) { r -= w[t[1]] ** 2; if (r <= 0) { tp = t; break; } }
          feed.append(el('button', { class: 'post', style: `background:hsl(${TOP.indexOf(tp) * 40} 70% ${document.body.classList.contains('lv-a') ? 22 : 92}%)`, onclick: e => { w[tp[1]] *= 1.9; mins += 2; e.currentTarget.classList.add('liked'); setTimeout(draw, 250); } }, el('span', { class: 'e' }, tp[0]), tp[1]));
        }
        const d = div(); mt.firstChild.style.width = Math.round(d * 100) + '%';
        ml.textContent = `Rozmanitosť feedu: ${Math.round(d * 100)} %` + (lv === 'a' ? ` · čas strávený v aplikácii: ${mins} min` : '');
        if (ph === 1 && d < .4) { ph = 2; beep(1); setPh(); }
        else if (ph === 2 && d > .7) { ph = 3; fin(); }
      };
      const dom = () => Object.entries(w).sort((a, b) => b[1] - a[1])[0][0];
      const setPh = () => { phase.innerHTML = ph === 1 ? '<b>Fáza 1:</b> Ťukaj stále na jednu tému. Sleduj, čo sa stane.' : `<b>Fáza 2:</b> Si v bubline, takmer všetko je „${dom()}“. Dostaň sa von: ťukaj na iné témy alebo použi „Nezaujíma ma“.`; };
      const nz = el('button', { class: 'btn small ghost', onclick: () => { const d0 = dom(); w[d0] = Math.max(1, w[d0] / 3); draw(); } }, 'Nezaujíma ma (dominantná téma)');
      const fin = () => {
        const q = lv === 'a' ? { q: 'Čo sa typický odporúčací algoritmus snaží maximalizovať?', a: ['Čas a pozornosť, ktorú v aplikácii strávim, lebo od nej závisia príjmy z reklamy.', 'To, aby som sa dozvedel čo najviac rôznych pohľadov.', 'Moje šťastie a duševné zdravie.'], why: 'Algoritmus nie je zlý ani dobrý. Optimalizuje **cieľ, ktorý mu nastavili ľudia**, najčastejšie zapojenie (engagement). Vedľajším účinkom môže byť [[informačná bublina]], silnejšie emócie aj polarizácia. EÚ preto v nariadení o digitálnych službách (DSA) vyžaduje, aby veľké platformy ponúkali aj feed, ktorý nie je založený na profilovaní.' }
          : { q: 'Čo je informačná bublina?', a: ['Keď ti aplikácia ukazuje stále to isté, lebo sa naučila, na čo klikáš.', 'Bublina so správou od kamaráta.', 'Chyba v aplikácii.'], why: 'Algoritmus sa učí z tvojich klikov a ukazuje ti viac toho istého. Nevidíš potom iné témy ani iné názory. **Vystúpiť z bubliny môžeš**: hľadaj aj inde, sleduj rôzne zdroje, používaj „nezaujíma ma“.' };
        const qb = el('div', { style: 'margin-top:12px' }); F.body.append(qb); mcQuestion(qb, q, ok => { if (ok) F.ok('Z bubliny si sa dostal(a) von.', q.why); else beep(0); });
      };
      setPh();
      F.body.append(phase, el('div', { class: 'row', style: 'margin-bottom:8px' }, nz), feed, mt, ml);
      draw();
    }
  };
}

T.confusion_a = {
  n: 'SŠ: Matica zámen', ss: true, run(box, ctx) {
    const SC = [
      { name: 'Model na skríning kožných znamienok', pos: 'podozrivé znamienko', neg: 'neškodné znamienko', worse: 'fn', why2: 'Pri skríningu je horšie **prehliadnuť** nebezpečné znamienko (falošne negatívny výsledok). Falošný poplach „len“ pošle človeka k lekárovi. Preto sa pri skríningu uprednostňuje vysoká **úplnosť (recall)**, aj za cenu viac falošných poplachov.' },
      { name: 'Spamový filter', pos: 'spam', neg: 'bežný e-mail', worse: 'fp', why2: 'Pri spame je horšie, keď sa **dôležitý e-mail** (napr. pozvánka na prijímačky) ocitne v koši, teda falošne pozitívny výsledok. Jeden spam navyše v schránke až tak nevadí. Preto sa pri spamových filtroch uprednostňuje vysoká **presnosť (precision)**.' }
    ];
    const sc = pick(SC);
    const TP = rnd(30, 60), FP = rnd(5, 25), FN = rnd(5, 25), TN = rnd(150, 260);
    const pct = x => (x * 100).toFixed(1).replace('.', ',') + ' %';
    const prec = TP / (TP + FP), rec = TP / (TP + FN), acc = (TP + TN) / (TP + FP + FN + TN);
    const F = TF(box, ctx, { title: 'SŠ rozšírenie: Matica zámen', lead: `**${sc.name}** sme otestovali na ${TP + FP + FN + TN} prípadoch. Pozitívny výsledok = „${sc.pos}“. Prečítaj si tabuľku a vypočítaj, ako dobre model funguje.`, fresh: true, help: 'Presnosť (precision) = TP ÷ (TP + FP): z toho, čo model označil ako pozitívne, koľko naozaj bolo pozitívne. Úplnosť (recall) = TP ÷ (TP + FN): z toho, čo naozaj bolo pozitívne, koľko model našiel.' });
    F.body.append(el('table', { class: 'tbl' },
      el('tr', {}, el('th', {}), el('th', {}, `Model: ${sc.pos}`), el('th', {}, `Model: ${sc.neg}`)),
      el('tr', {}, el('th', {}, `Skutočne: ${sc.pos}`), el('td', { class: 'n' }, `TP = ${TP}`), el('td', { class: 'n' }, `FN = ${FN}`)),
      el('tr', {}, el('th', {}, `Skutočne: ${sc.neg}`), el('td', { class: 'n' }, `FP = ${FP}`), el('td', { class: 'n' }, `TN = ${TN}`))),
      el('p', { style: 'font-size:13.5px;color:var(--mute);margin:8px 0 0' }, 'TP = správne pozitívny, FP = falošne pozitívny (falošný poplach), FN = falošne negatívny (prehliadnutý prípad), TN = správne negatívny.'));
    // jedinečné možnosti: správna + rušivé (bez duplicít)
    const uniq = (ok, cands) => { const out = [pct(ok)]; for (const c of [...cands, ok * .8, ok * .9 + .05, 1 - ok, ok / 2 + .3]) { const t = pct(Math.min(.999, Math.max(.001, c))); if (!out.includes(t)) out.push(t); if (out.length === 4) break; } return out; };
    const steps = [
      { q: 'Aká je **presnosť (precision)** modelu?', a: uniq(prec, [rec, acc, TP / (TP + FP + FN + TN)]), why: `Presnosť = TP ÷ (TP + FP) = ${TP} ÷ ${TP + FP} = ${pct(prec)}.` },
      { q: 'Aká je **úplnosť (recall)** modelu?', a: uniq(rec, [prec, acc, FN / (TP + FN)]), why: `Úplnosť = TP ÷ (TP + FN) = ${TP} ÷ ${TP + FN} = ${pct(rec)}. Celková správnosť (accuracy) je ${pct(acc)}. Pri nevyvážených dátach však môže klamať: väčšinu tvoria negatívne prípady.` },
      { q: 'Ktorá chyba je pri tomto použití **horšia**?', a: sc.worse === 'fn' ? ['Falošne negatívna (FN): prehliadnuté podozrivé znamienko', 'Falošne pozitívna (FP): zbytočný poplach', 'Obe sú rovnako zlé, na použití nezáleží'] : ['Falošne pozitívna (FP): dôležitý e-mail skončí v spame', 'Falošne negatívna (FN): jeden spam navyše v schránke', 'Obe sú rovnako zlé, na použití nezáleží'], why: sc.why2 }
    ];
    let i = 0; const qb = el('div', { style: 'margin-top:14px' }); F.body.append(qb);
    const step = () => { qb.innerHTML = ''; const fbx = el('div', {}); mcQuestion(qb, steps[i], ok => { if (!ok) { beep(0); return; } beep(1); fbx.append(el('div', { class: 'why', html: rich(steps[i].why) })); if (i + 1 < steps.length) fbx.append(el('div', { class: 'acts' }, el('span', { class: 'sp' }), el('button', { class: 'btn', onclick: () => { i++; step(); } }, 'Ďalej'))); else F.ok('Vyhodnotenie modelu je hotové.', 'Jedno číslo („model má 95 % úspešnosť“) nestačí. Treba vedieť, **aké chyby** model robí a **ktoré sú v danom použití nebezpečnejšie**. Posunom rozhodovacieho prahu sa dá meniť pomer medzi presnosťou a úplnosťou. Je to rozhodnutie ľudí, nie stroja.'); }); qb.append(fbx); };
    step();
  }
};
